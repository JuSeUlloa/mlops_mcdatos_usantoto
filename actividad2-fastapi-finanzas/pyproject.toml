[project]
name = "actividad02-mlops-api"
version = "0.3.0"
description = "SmartPortfolio API - Financial market analysis and ML predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.4",
    "matplotlib>=3.11.0",
    "pandas>=2.2.0,<3.0.0",
    "requests>=2.34.2",
    "uvicorn>=0.41.0",
    "yfinance>=1.5.1",
    "scikit-learn>=1.3.0",
    "mlflow>=2.9.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]
