data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"

features:
  target: "Close"
  numeric:
    - "Open"
    - "High"
    - "Low"
    - "Volume"
    - "MA_7"
    - "MA_30"
    - "Volatility_7"
    - "Return_1d"
    - "Return_7d"
  lag_features:
    - 1
    - 3
    - 5
    - 7

split:
  test_size: 0.2
  random_state: 42

model:
  random_state: 42
  n_estimators: 100
  max_depth: 10

mlflow:
  tracking_uri: "sqlite:///mlruns/mlflow.db"
  experiment_name: "stock_price_regression"
